name: Package GO7 final build

on:
  push:
    branches:
      - go7-recovery-work-20261113
      - go7-final-deploy-20261113
      - fix-post-detail-full-content-20261113
      - fix-content-excerpts-20261113
      - fix-category-menu-routes-20261113
      - simplify-go7-routes-20261113
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript, database and routes
        run: |
          node --check public/app.js
          node --check public/search.js
          node --check public/admin.js
          node --check public/site.js
          node --check public/category.js
          node --check public/detail.js
          node --check worker/src/index.js
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          root = pathlib.Path("public")
          worker = pathlib.Path("worker")
          ET.parse(root / "sitemap.xml")

          categories = [
              "jobs-vacancies",
              "results",
              "admit-cards-exams",
              "answer-keys",
              "admissions-education",
              "important-notices",
          ]
          missing = [slug for slug in categories if not (root / slug / "index.html").is_file()]
          assert not missing, f"Missing consolidated category pages: {missing}"

          sitemap_index = (root / "sitemap.xml").read_text(encoding="utf-8")
          category_sitemap_path = root / "sitemap-categories.xml"
          assert category_sitemap_path.is_file(), "Category sitemap is missing"
          category_sitemap = category_sitemap_path.read_text(encoding="utf-8")
          assert "https://jobs.go7.in/sitemap-categories.xml" in sitemap_index, "Category sitemap is missing from sitemap index"
          for slug in categories:
              assert f"https://jobs.go7.in/{slug}/" in category_sitemap, f"{slug} missing from category sitemap"

          redirects = (root / "_redirects").read_text(encoding="utf-8")
          assert "/detail/:slug/ /detail.html 200" in redirects
          assert "/latest-jobs/ /jobs-vacancies/ 301" in redirects
          assert "/admit-cards/ /admit-cards-exams/ 301" in redirects
          assert "/documents/ /important-notices/ 301" in redirects
          assert not any(line.strip().startswith("/:slug/") for line in redirects.splitlines()), "Legacy catch-all must not capture category routes"

          index = (root / "index.html").read_text(encoding="utf-8")
          for slug in categories:
              assert f'data-category="{slug}"' in index, f"{slug} missing from homepage"
          assert index.count('class="home-category-panel') == 6, "Homepage must show six consolidated categories"
          assert index.count('class="panel-refresh"') == 6, "Every homepage category needs a refresh control"
          assert "View All" in index
          assert 'action="/search.html"' in index
          assert "© 2026 GO7. Independent information service." in index

          app = (root / "app.js").read_text(encoding="utf-8")
          category_js = (root / "category.js").read_text(encoding="utf-8")
          search_js = (root / "search.js").read_text(encoding="utf-8")
          detail_js = (root / "detail.js").read_text(encoding="utf-8")
          admin_js = (root / "admin.js").read_text(encoding="utf-8")

          assert 'limit:"15"' in app, "Homepage category previews must show at most 15 posts"
          assert 'viewAll.style.display=Number(data.total||0)>15?"inline-flex":"none"' in app, "Homepage View All must only show when a category has more than 15 posts"
          assert "const limit=24" in category_js, "Category pages must paginate in groups of 24"
          assert 'addEventListener("click",()=>{offset+=limit;load(true);})' in category_js, "Load More pagination is missing"
          assert "const postHref=post=>" in app
          assert "pathSlug.match(/-(\\d+)$/)" in detail_js
          assert "p.ai_details?.overview||p.summary" in detail_js
          assert (root / "search.html").is_file() and (root / "search.js").is_file()
          assert "application_last_date" in detail_js and "Closed" in category_js
          assert "Automatic publishing is enabled" in (root / "go7-owner-desk-7f3c9a/index.html").read_text(encoding="utf-8")
          assert "Auto-published official notices" in admin_js
          assert "data-approve" not in admin_js and "Approve & publish" not in admin_js, "Manual review approval controls must stay removed"
          admin_console = (root / "go7-owner-desk-7f3c9a/index.html").read_text(encoding="utf-8")
          assert "Sync process monitor" in admin_console and "syncProgressBar" in admin_console, "Live sync monitor is missing from Admin"
          assert 'name="robots" content="noindex,nofollow"' in admin_console, "Admin console must remain noindex"
          assert "renderSyncStatus" in admin_js and "/api/admin/sync/status" in admin_js, "Admin live status polling is missing"
          assert "completed_with_errors" in admin_js and "Automatic 30-minute schedule" in admin_js, "Admin must distinguish automatic runs and source errors"
          assert "Live Worker status unavailable:" in admin_js, "Admin must show a clear error when live Worker progress is unavailable"
          assert 'admin.js?v=go7-admin-auto-cron-20261115' in admin_console, "Admin script cache must be refreshed for automatic sync status"
          assert 'styles.css?v=go7-admin-auto-cron-20261115' in admin_console, "Admin styles cache must be refreshed for sync warnings"

          worker_js = (worker / "src/index.js").read_text(encoding="utf-8")
          assert "createAdminSyncReporter" in worker_js and "admin_sync_status" in worker_js, "D1-backed admin progress reporter is missing"
          assert "HINDI_RECRUITMENT_RE" in worker_js and "HINDI_EDUCATION_RE" in worker_js, "Hindi official notice parsing is missing"
          assert "let reachableUrl=null" in worker_js and "no_matches:Boolean(reachableUrl)" in worker_js, "Reachable sources with no matching notices must not be reported as network errors"
          assert 'urls:["https://nta.ac.in/NoticeBoardArchive","https://www.nta.ac.in/NoticeBoardArchive"]' in worker_js, "NTA canonical hostname fallback is missing"
          assert 'urls:["https://psc.wb.gov.in/whats_new.jsp","https://psc.wb.gov.in/notification_announcement.jsp","https://psc.wb.gov.in/"]' in worker_js, "WBPSC current notices fallback is missing"
          assert 'urls:["https://exam.biharboardonline.org/home","https://exam.biharboardonline.org/","https://www.biharboardonline.org/"]' in worker_js, "Bihar Board current notices home is missing"
          assert 'https://degree.samsodisha.gov.in/DegreeNew/DegreeNoticeDtl.aspx' in worker_js, "SAMS detailed notices route is missing"
          assert 'Referer":"https://www.incometaxindia.gov.in/tax-feeds' in worker_js, "Income Tax RSS publisher referrer is missing"
          assert 'GO7GovernmentUpdates/1.0' in worker_js, "Official source fetch user-agent is missing"
          assert 'if(path==="/api/admin/sync/status"&&request.method==="GET")' in worker_js, "Authenticated sync status endpoint is missing"
          assert 'createAdminSyncReporter(env.DB,runId,"scheduled_sync_status")' in worker_js, "Automatic Cron progress reporting is missing"
          assert 'trigger:"automatic"' in worker_js and 'trigger:"manual"' in worker_js, "Manual/automatic sync source labels are missing"
          assert 'status:completedWithErrors?"completed_with_errors":"completed"' in worker_js, "Sync errors must not be reported as a clean completion"
          assert 'appointment:\\s*(?:recruitment|contractual|deputation|re-employment|absorption)' in worker_js, "Employment News parser must not exclude valid vacancy titles by job-title allowlist"
          assert "syncOfficialMonitors(env.DB,env,dateBudget,publishedThisSyncByCategory,async update=>" in worker_js, "Official monitor progress callback is missing"
          assert "env.AI.toMarkdown" in worker_js, "Automatic HTML/PDF conversion is missing"
          assert "function officialPdfLinks" in worker_js, "Official PDF discovery is missing"
          assert "extractNoticeDatesFromText" in worker_js
          assert "syncOfficialMonitors(env.DB,env,dateBudget,publishedThisSyncByCategory,async update=>" in worker_js
          assert "auto_published:inserted" in worker_js
          assert "const reviewMatch=path.match" not in worker_js, "Manual approval/dismiss API must stay removed"
          assert "const dateBudget={used:0,max:2}" in worker_js
          assert "const OFFICIAL_MONITOR_BATCH_SIZE = 6" in worker_js
          assert "official_monitor_cursor" in worker_js
          rotation_migration = worker / "migrations/0009_sync_rotation.sql"
          assert rotation_migration.is_file(), "Official monitor rotation migration is missing"
          assert "CREATE TABLE IF NOT EXISTS sync_state" in rotation_migration.read_text(encoding="utf-8")
          assert "12*60*60*1000" in worker_js, "Date extraction cooldown is missing"

          migration = worker / "migrations/0008_auto_notice_date_extraction.sql"
          assert migration.is_file(), "Automatic date extraction migration is missing"
          migration_sql = migration.read_text(encoding="utf-8")
          for field in ("date_checked_at", "date_evidence"):
              assert migration_sql.count(field) == 2, f"Expected {field} on posts and review_items"

          not_found = (root / "404.html").read_text(encoding="utf-8")
          assert "search.html" in not_found
          print("GO7 category, pagination, date-extraction, JavaScript and sitemap checks passed")
          PY
      - name: Assemble complete project ZIP
        run: |
          mkdir -p /tmp/go7-package/go7-government-portal-main
          cp -a . /tmp/go7-package/go7-government-portal-main/
          rm -rf /tmp/go7-package/go7-government-portal-main/.git /tmp/go7-package/go7-government-portal-main/.github
          cd /tmp/go7-package
          zip -qr "$GITHUB_WORKSPACE/GO7-Portal-Full-Redesign-1100px.zip" go7-government-portal-main
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: GO7-Portal-Full-Redesign-1100px
          path: GO7-Portal-Full-Redesign-1100px.zip
          if-no-files-found: error
          retention-days: 14
