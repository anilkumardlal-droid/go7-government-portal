name: Package GO7 final build

on:
  push:
    branches:
      - go7-recovery-work-20261113
      - go7-final-deploy-20261113
      - fix-post-detail-full-content-20261113
      - fix-content-excerpts-20261113
      - fix-category-menu-routes-20261113
      - simplify-go7-routes-20261113
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript, database and routes
        run: |
          node --check public/app.js
          node --check public/search.js
          node --check public/admin.js
          node --check public/site.js
          node --check public/category.js
          node --check public/detail.js
          node --check worker/src/index.js
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          root = pathlib.Path("public")
          worker = pathlib.Path("worker")
          ET.parse(root / "sitemap.xml")

          categories = [
              "jobs-vacancies",
              "results",
              "admit-cards-exams",
              "answer-keys",
              "admissions-education",
              "important-notices",
          ]
          missing = [slug for slug in categories if not (root / slug / "index.html").is_file()]
          assert not missing, f"Missing consolidated category pages: {missing}"

          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          for slug in categories:
              assert f"https://jobs.go7.in/{slug}/" in sitemap, f"{slug} missing from sitemap"

          redirects = (root / "_redirects").read_text(encoding="utf-8")
          assert "/detail/:slug/ /detail.html 200" in redirects
          assert "/latest-jobs/ /jobs-vacancies/ 301" in redirects
          assert "/admit-cards/ /admit-cards-exams/ 301" in redirects
          assert "/documents/ /important-notices/ 301" in redirects
          assert not any(line.strip().startswith("/:slug/") for line in redirects.splitlines()), "Legacy catch-all must not capture category routes"

          index = (root / "index.html").read_text(encoding="utf-8")
          for slug in categories:
              assert f'data-category="{slug}"' in index, f"{slug} missing from homepage"
          assert index.count('class="home-category-panel') == 6, "Homepage must show six consolidated categories"
          assert index.count('class="panel-refresh"') == 6, "Every homepage category needs a refresh control"
          assert "View All" in index
          assert 'action="/search.html"' in index
          assert "© 2026 GO7. Independent information service." in index

          app = (root / "app.js").read_text(encoding="utf-8")
          category_js = (root / "category.js").read_text(encoding="utf-8")
          search_js = (root / "search.js").read_text(encoding="utf-8")
          detail_js = (root / "detail.js").read_text(encoding="utf-8")
          admin_js = (root / "admin.js").read_text(encoding="utf-8")

          assert 'limit:"20"' in app, "Homepage category previews must be capped at 20"
          assert "const limit=24" in category_js, "Category pages must paginate in groups of 24"
          assert 'addEventListener("click",()=>{offset+=limit;load(true);})' in category_js, "Load More pagination is missing"
          assert "postHref(post)" in app
          assert "pathSlug.match(/-(\\d+)$/)" in detail_js
          assert "p.ai_details?.overview||p.summary" in detail_js
          assert (root / "search.html").is_file() and (root / "search.js").is_file()
          assert "application_last_date" in detail_js and "APPLICATION CLOSED" in category_js
          assert "data-published" in admin_js and "data-deadline" in admin_js
          assert "item.date_evidence" in admin_js, "Review queue must show date extraction evidence"

          worker_js = (worker / "src/index.js").read_text(encoding="utf-8")
          assert "env.AI.toMarkdown" in worker_js, "Automatic HTML/PDF conversion is missing"
          assert "function officialPdfLinks" in worker_js, "Official PDF discovery is missing"
          assert "extractNoticeDatesFromText" in worker_js
          assert "syncOfficialMonitors(env.DB,env,dateBudget)" in worker_js
          assert "const dateBudget={used:0,max:8}" in worker_js
          assert "12*60*60*1000" in worker_js, "Date extraction cooldown is missing"

          migration = worker / "migrations/0008_auto_notice_date_extraction.sql"
          assert migration.is_file(), "Automatic date extraction migration is missing"
          migration_sql = migration.read_text(encoding="utf-8")
          for field in ("date_checked_at", "date_evidence"):
              assert migration_sql.count(field) == 4, f"Expected {field} on both posts and review_items"

          not_found = (root / "404.html").read_text(encoding="utf-8")
          assert "search.html" in not_found
          print("GO7 category, pagination, date-extraction, JavaScript and sitemap checks passed")
          PY
      - name: Assemble complete project ZIP
        run: |
          mkdir -p /tmp/go7-package/go7-government-portal-main
          cp -a . /tmp/go7-package/go7-government-portal-main/
          rm -rf /tmp/go7-package/go7-government-portal-main/.git /tmp/go7-package/go7-government-portal-main/.github
          cd /tmp/go7-package
          zip -qr "$GITHUB_WORKSPACE/GO7-Portal-Full-Redesign-1100px.zip" go7-government-portal-main
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: GO7-Portal-Full-Redesign-1100px
          path: GO7-Portal-Full-Redesign-1100px.zip
          if-no-files-found: error
          retention-days: 14
