name = "go7-government-api"
main = "src/index.js"
compatibility_date = "2026-11-11"
workers_dev = true

[[routes]]
pattern = "jobs.go7.in/sitemap*"
zone_name = "go7.in"

[[d1_databases]]
binding = "DB"
database_name = "go7-gov-db"
database_id = "b0a981cf-e0b1-417c-981f-805997d76f66"
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://jobs.go7.in"
PUBLIC_SITE_URL = "https://jobs.go7.in"
MAX_ITEMS_PER_FEED = "25"

[ai]
binding = "AI"
